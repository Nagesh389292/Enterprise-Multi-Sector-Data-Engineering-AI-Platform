version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: enterprise_postgres
    environment:
      POSTGRES_DB: enterprise_db
      POSTGRES_USER: platform_user
      POSTGRES_PASSWORD: platform_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: enterprise_redis
    ports:
      - "6379:6379"

  superset:
    image: apache/superset:latest
    container_name: enterprise_superset
    ports:
      - "8088:8088"
    environment:
      - SUPERSET_SECRET_KEY=enterprise-superset-secret-key-development
    depends_on:
      - postgres
      - redis

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: enterprise_django_backend
    ports:
      - "8000:8000"
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - DATABASE_URL=postgres://platform_user:platform_password@postgres:5432/enterprise_db
      - REDIS_URL=redis://redis:6379/0
      - SUPERSET_URL=http://superset:8088
    depends_on:
      - postgres
      - redis

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: enterprise_react_frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
