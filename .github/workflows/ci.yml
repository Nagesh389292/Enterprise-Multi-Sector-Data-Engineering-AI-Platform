name: Enterprise Intelligence Platform CI/CD

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-python:
    name: Run Python Test Suite & Audits
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff pytest pandas numpy scikit-learn xgboost lightgbm torch matplotlib shap psycopg2-binary pyarrow pyspark databricks-sdk requests sqlglot python-dotenv

      - name: Lint Code with Ruff
        run: |
          ruff check . --select E,F,W --ignore E501 || true

      - name: Run Master Unit Test Suite
        run: |
          python run_tests.py

      - name: Databricks Configuration Health Check
        if: env.DATABRICKS_TOKEN != ''
        env:
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
          DATABRICKS_HOST: https://dbc-988b03b0-c952.cloud.databricks.com
          DATABRICKS_WAREHOUSE_ID: 1f1403d78bfa0404
          DATABRICKS_CATALOG: workspace
          DATABRICKS_SCHEMA: enterprise_gold
        run: |
          python scripts/check_databricks.py
        continue-on-error: true

      - name: Verify Multi-Sector Real World Ingestion
        run: |
          python verify_milestone5_real_data.py

      - name: Verify BI & Superset Layer
        run: |
          python verify_milestone6_bi.py

      - name: Verify Advanced Business Analytics
        run: |
          python verify_milestone7_analytics.py

  build-frontend:
    name: Build React Command Center UI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci --legacy-peer-deps || npm i --legacy-peer-deps

      - name: Build Vite Production Bundle
        working-directory: ./frontend
        run: npm run build

  docker-build:
    name: Build & Verify Production Docker Images
    needs: [test-python, build-frontend]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Container Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./backend/Dockerfile
          push: false
          tags: enterprise-backend:latest

      - name: Build Frontend Container Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          tags: enterprise-frontend:latest

  deploy-gcp-cloud-run:
    name: Deploy to GCP Cloud Run (Production)
    needs: docker-build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
        continue-on-error: true

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        continue-on-error: true

      - name: Deploy Cloud Run Service Notification
        run: |
          echo "Simulated GCP Cloud Run deployment active for project enterprise-data-ai-platform."
