version: 2

models:
  - name: stg_transactions
    description: "Staging model for raw transactions"
    columns:
      - name: transaction_id
        description: "Primary key"
        tests:
          - unique
          - not_null
      - name: amount_usd
        tests:
          - not_null

  - name: int_fraud_summary
    description: "Aggregated customer fraud summary"
    columns:
      - name: customer_id
        tests:
          - unique
          - not_null

  - name: dim_customer
    description: "Enriched customer dimension mart"
    columns:
      - name: customer_id
        tests:
          - unique
          - not_null
